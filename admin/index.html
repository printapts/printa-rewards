<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printa Game Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fff;font-family:Tahoma,Arial;min-height:100vh;display:grid;place-items:center;padding:18px}.box{width:min(430px,100%);background:#fff;color:#172033;border-radius:26px;padding:24px;box-shadow:0 20px 50px #0007}.brand{font-size:32px;font-weight:900}.brand i{color:#ffd43b;font-style:normal}h1{font-size:24px;margin:12px 0 5px}p{color:#667085;line-height:1.7}input{width:100%;height:55px;border:1px solid #d7dce5;border-radius:15px;text-align:center;font:bold 19px Tahoma;direction:ltr;margin:10px 0}button{width:100%;border:0;border-radius:15px;padding:15px;background:#e72e75;color:#fff;font:bold 18px Tahoma;cursor:pointer}.msg{min-height:30px;text-align:center;margin-top:13px;font-weight:bold}.ok{color:#168a4c}.bad{color:#c42b54}.small{font-size:12px;color:#8992a3;text-align:center;margin-top:12px}</style></head><body>
<div class="box"><div class="brand">Pr<i>i</i>nta</div><h1>🎮 إدارة محاولات اللعبة</h1><p>اكتب رقم العميل واضغط الزر. هيضاف له 5 محاولات فورًا.</p><input id="phone" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx"><button id="add">+5 محاولات</button><div id="msg" class="msg"></div><div class="small">صفحة إدارة خاصة — لا تشارك رابطها مع العملاء.</div></div>
<script>
const U='https://hnwzpsbqznugfqmjysyt.supabase.co',K='sb_publishable_eQ27kGNwDRLLRCPb71aIFA_UPoxP3fq',SYNC='PRN-7x29-K4m8-2026';
function norm(v){const a='٠١٢٣٤٥٦٧٨٩',b='۰۱۲۳۴۵۶۷۸۹';return String(v).replace(/[٠-٩]/g,x=>a.indexOf(x)).replace(/[۰-۹]/g,x=>b.indexOf(x)).replace(/\D/g,'')}
add.onclick=async()=>{let p=norm(phone.value);msg.className='msg';if(!/^01\d{9}$/.test(p)){msg.textContent='راجع رقم الموبايل';msg.classList.add('bad');return}add.disabled=true;msg.textContent='جاري الإضافة…';try{let r=await fetch(U+'/rest/v1/rpc/add_game_attempts',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({p_sync_key:SYNC,p_phone:p,p_attempts:5})});let t=await r.text();if(!r.ok)throw Error(t);let n=Number(t);msg.textContent='✅ تم — العميل عنده الآن '+n+' محاولات';msg.classList.add('ok')}catch(e){msg.textContent='❌ حصلت مشكلة في الإضافة';msg.classList.add('bad')}finally{add.disabled=false}};
phone.onkeydown=e=>{if(e.key==='Enter')add.click()};
</script></body></html>
